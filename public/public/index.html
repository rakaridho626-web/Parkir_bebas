<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Parkir - UKK RPL Paket 2</title>
    <!-- Tailwind CSS CDN untuk tampilan modern, responsive & smooth -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glassmorphism {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
        }
        @media print {
            body * { visibility: hidden; }
            #receipt-print-area, #receipt-print-area * { visibility: visible; }
            #receipt-print-area { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="login-section" class="flex min-h-screen items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
        <div class="glassmorphism w-full max-w-md p-8 rounded-3xl shadow-2xl border border-white/20">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-blue-500 rounded-2xl flex items-center justify-center text-white text-3xl mx-auto shadow-lg shadow-indigo-500/30 mb-3">
                    <i class="fa-solid fa-square-parking"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">APLIKASI PARKIR</h1>
                <p class="text-xs text-slate-500 font-semibold tracking-wider uppercase mt-1">Uji Kompetensi Keahlian RPL P2</p>
            </div>

            <div id="login-alert" class="hidden mb-4 p-3 rounded-xl text-sm bg-rose-50 text-rose-700 border border-rose-200"></div>

            <form id="form-login" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username</label>
                    <div class="relative">
                        <i class="fa-regular fa-user absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="text" id="login-username" required placeholder="admin / petugas / owner" 
                            class="w-full pl-11 pr-4 py-3 bg-slate-100/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="password" id="login-password" required placeholder="123456" 
                            class="w-full pl-11 pr-4 py-3 bg-slate-100/70 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" 
                        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
                        <span>Masuk Sistem</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-200 text-center">
                <p class="text-xs text-slate-500">Akun Pengujian Cepat:</p>
                <div class="flex justify-center gap-2 mt-2">
                    <button onclick="quickFill('admin')" class="px-2.5 py-1 text-xs bg-slate-200 hover:bg-slate-300 rounded-lg font-medium text-slate-700">Admin</button>
                    <button onclick="quickFill('petugas')" class="px-2.5 py-1 text-xs bg-slate-200 hover:bg-slate-300 rounded-lg font-medium text-slate-700">Petugas</button>
                    <button onclick="quickFill('owner')" class="px-2.5 py-1 text-xs bg-slate-200 hover:bg-slate-300 rounded-lg font-medium text-slate-700">Owner</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="main-section" class="hidden min-h-screen flex flex-col md:flex-row bg-slate-100">
        <!-- SIDEBAR -->
        <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col justify-between p-5 border-r border-slate-800">
            <div>
                <!-- Brand -->
                <div class="flex items-center gap-3 px-2 mb-8">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-xl shadow-md">
                        <i class="fa-solid fa-square-parking"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-base leading-tight">PARKIR PRO</h2>
                        <span class="text-[10px] text-indigo-400 font-semibold tracking-wider uppercase">UKK RPL 2025/2026</span>
                    </div>
                </div>

                <!-- User profile badge -->
                <div class="bg-slate-800/80 p-3 rounded-2xl mb-6 flex items-center gap-3 border border-slate-700/50">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center font-bold text-sm">
                        <span id="user-avatar">A</span>
                    </div>
                    <div class="overflow-hidden">
                        <p id="user-name" class="font-bold text-sm truncate text-white">Administrator</p>
                        <span id="user-role-badge" class="px-2 py-0.5 text-[10px] uppercase font-bold rounded bg-indigo-500/20 text-indigo-400">Admin</span>
                    </div>
                </div>

                <!-- Navigation Links -->
                <nav class="space-y-1.5" id="nav-links">
                    <!-- Nav items injected by JavaScript based on role -->
                </nav>
            </div>

            <!-- Logout Button -->
            <button onclick="handleLogout()" class="w-full mt-6 py-2.5 px-4 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-semibold text-sm rounded-xl transition flex items-center gap-3">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>Keluar (Logout)</span>
            </button>
        </aside>

        <!-- CONTENT AREA -->
        <main class="flex-1 p-6 md:p-8 overflow-y-auto">
            <!-- TOP BAR -->
            <header class="flex flex-col sm:flex-row sm:items-center justify-between pb-6 border-b border-slate-200 mb-6 gap-4">
                <div>
                    <h2 id="page-title" class="text-2xl font-extrabold text-slate-800">Dashboard Utama</h2>
                    <p id="page-subtitle" class="text-xs text-slate-500 mt-1">Ringkasan operasional dan statistik perparkiran hari ini</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="px-3.5 py-1.5 bg-white rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 shadow-sm flex items-center gap-2">
                        <i class="fa-regular fa-clock text-indigo-600"></i>
                        <span id="realtime-clock">00:00:00</span>
                    </div>
                </div>
            </header>

            <!-- DYNAMIC VIEW PAGES -->
            <div id="view-container">
                <!-- Views loaded dynamically: dashboard, transaksi, users, tarif, area, kendaraan, logs, laporan -->
            </div>
        </main>
    </div>

    <!-- MODAL POPUP GLOBAL -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm">
        <div id="modal-content" class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all p-6">
            <!-- Modal Body dynamically injected -->
        </div>
    </div>

    <!-- PRINT STRUK CONTAINER (Tersembunyi di web, hanya tampil saat print) -->
    <div id="receipt-print-area" class="hidden font-mono p-4 max-w-xs mx-auto text-black"></div>

    <script src="app.js"></script>
</body>
</html>
