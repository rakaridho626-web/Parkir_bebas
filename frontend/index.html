<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parkir Bebas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&display=swap">
    <link rel="stylesheet" href="css/style.css?v=3d9">
</head>
<body>

    <!-- LANDING PAGE + LOGIN (kursor: atas = Owner, kiri bawah = Petugas, kanan bawah = Admin) -->
    <div id="login-view" class="landing" hidden>
        <canvas id="scene" aria-hidden="true"></canvas>
        <div class="landing-vignette"></div>
        <span class="landing-clock" id="landing-clock" hidden></span>

        <div class="landing-hero">
            <p class="eyebrow">Sistem Manajemen Parkir</p>
            <h1>Parkir<br><span>Bebas</span></h1>
            <p class="landing-hint">Arahkan kursor ke ujung layar untuk masuk</p>
        </div>

        <div id="portals"></div>
    </div>

    <!-- HALAMAN APLIKASI (Fallback) -->
    <div id="app-view" class="layout" hidden>
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span class="logo">P</span>
                <div><b>Parkir Bebas</b><small>Sistem Manajemen Parkir</small></div>
            </div>
            <nav id="menu" class="menu"></nav>
            <button class="menu-item" id="btn-logout" type="button"></button>
        </aside>
        <div class="backdrop" id="backdrop"></div>

        <div class="main">
            <header class="topbar">
                <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Buka menu"></button>
                <h2 id="page-title"></h2>
                <div class="user-chip">
                    <span id="clock" class="muted"></span>
                    <span id="user-name"></span>
                    <span class="badge" id="user-role"></span>
                </div>
            </header>
            <main id="page" class="page"></main>
        </div>
    </div>

    <!-- PANEL SPASIAL 3D (OWNER, PETUGAS, & ADMIN): pojok kanan atas = Dashboard, pojok kiri bawah = Panel Kerja 3D -->
    <div id="owner-view" class="owner" hidden>
        <div class="lot-stage" aria-hidden="true">
            <div class="lot-tilt"><div class="lot-plane" id="lot-plane"></div></div>
        </div>
        <div class="owner-vignette"></div>

        <span id="owner-sub" hidden></span>

        <main id="owner-page" class="owner-page"></main>

        <a class="corner corner-tr" id="corner-tr" data-go="dashboard" href="#/dashboard">
            <span><b id="corner-tr-b">Dashboard</b><small id="corner-tr-s">kondisi sekarang</small></span>
            <i>↗<svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/><circle class="ring-isi" cx="18" cy="18" r="15"/></svg></i>
        </a>
        <a class="corner corner-bl" id="corner-bl" data-go="laporan" href="#/laporan">
            <i>↙<svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/><circle class="ring-isi" cx="18" cy="18" r="15"/></svg></i>
            <span><b id="corner-bl-b">Rekap</b><small id="corner-bl-s">analisis transaksi</small></span>
        </a>

        <div class="owner-user">
            <span id="owner-name"></span>
            <button type="button" id="owner-logout">Keluar</button>
        </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>
    <div id="print-area"></div>

    <script src="js/config.js?v=3d9"></script>
    <script src="js/api.js?v=3d9"></script>
    <script src="js/ui.js?v=3d9"></script>
    <script src="js/scene.js?v=3d9"></script>
    <script src="js/landing.js?v=3d9"></script>
    <script src="js/pages/dashboard.js?v=3d9"></script>
    <script src="js/pages/crud.js?v=3d9"></script>
    <script src="js/pages/transaksi.js?v=3d9"></script>
    <script src="js/pages/log.js?v=3d9"></script>
    <script src="js/owner.js?v=3d9"></script>
    <script src="js/app.js?v=3d9"></script>
</body>
</html>
